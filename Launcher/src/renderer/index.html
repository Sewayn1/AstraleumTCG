<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Astraleum Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background artwork -->
  <div class="bg-image" aria-hidden="true"></div>

  <!-- Animated background -->
  <div class="stars" aria-hidden="true">
    <div class="stars-layer stars-a"></div>
    <div class="stars-layer stars-b"></div>
    <div class="stars-layer stars-c"></div>
  </div>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Custom title bar -->
  <div class="titlebar">
    <span id="launcher-version" class="launcher-version-text">v—</span>
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button id="btn-wm-min"   class="wm-btn"          title="Réduire">&#8722;</button>
      <button id="btn-wm-close" class="wm-btn wm-close" title="Fermer">&#x2715;</button>
    </div>
  </div>

  <!-- Main layout -->
  <div class="layout">

    <!-- Left sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo-wrap">
          <img src="../../img/logo2.png" alt="Astraleum" class="logo-img">
        </div>
        <h1 class="game-title">ASTRALEUM</h1>
        <p class="game-subtitle">Trading Card Game</p>
      </div>

      <div class="sidebar-status">
        <div id="status-badge" class="status-badge status-checking">
          <span class="status-dot"></span>
          <span id="status-text">Vérification…</span>
        </div>
        <div id="version-display" class="version-display">—</div>
      </div>

      <div class="sidebar-bottom">
        <button id="btn-settings" class="btn-settings">&#9881;&nbsp; Paramètres</button>
      </div>
    </aside>

    <!-- Changelog panel -->
    <main class="main-panel">
      <div class="panel-header">
        <span class="panel-label">NOTES DE PATCH</span>
      </div>
      <div id="changelog-container" class="changelog-container">
        <div class="cl-placeholder">Chargement…</div>
      </div>
    </main>

  </div>

  <!-- Bottom action bar -->
  <div class="bottombar">
    <div class="progress-area" id="progress-area">
      <div id="progress-info" class="progress-info"></div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <button id="btn-action" class="btn-action" disabled>Vérification…</button>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <span>Paramètres</span>
      <button id="btn-close-settings">&#x2715;</button>
    </div>
    <div class="settings-body">
      <label class="settings-label">Dossier du jeu</label>
      <div class="path-row">
        <input id="game-path-input" type="text" readonly placeholder="Sélectionner un dossier…">
        <button id="btn-browse">Parcourir</button>
      </div>
    </div>
    <div class="settings-footer">
      <button id="btn-uninstall" class="btn-danger">Désinstaller</button>
      <button id="btn-save-settings" class="btn-primary">Enregistrer</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
